[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uvtransfer"
version = "1.0.0"
description = "Tomte: move textures (including tangent-space normal maps) between two UV layouts of the same mesh"
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER"]
authors = [{ name = "feanix" }]
dependencies = ["numpy", "Pillow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.urls]
Homepage = "https://github.com/feanix/Tomte"
Issues = "https://github.com/feanix/Tomte/issues"

[project.optional-dependencies]
gui = ["PySide6"]
precision = ["opencv-python-headless"]   # full-precision 16-bit colour PNG/TIFF input

[project.scripts]
uvtransfer = "uvtransfer.cli:main"

[project.gui-scripts]
tomte = "uvtransfer.gui.app:main"

[tool.setuptools.packages.find]
include = ["uvtransfer*"]
